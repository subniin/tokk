<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>tokk listen() test page</title>
  <style>
    /* Page rules for the overlay style-isolation test (test/web/overlay.spec.ts). */
    body { font-size: 27px; color: rgb(255, 0, 0); }
    h1 { font-size: 41px; font-weight: 300; }
  </style>
</head>
<body>
  <!-- Test page for test/web/listen.spec.ts. It uses only the built bundle /dist/tokk.js. -->
  <h1 id="page-title">Overlay test page</h1>
  <button id="start" type="button">Start listening</button>
  <script type="module">
    import { listen, loadSounds } from '/dist/tokk.js';

    const params = new URLSearchParams(location.search);
    const source = params.get('source') ?? undefined;
    const modelUrl = params.get('model');
    const patterns = (params.get('patterns') ?? 'low,mid,high,ring').split(',');

    // The spec reads this object. It holds handler calls and the outcome of listen(), nothing else.
    const state = { calls: [], ready: false, rejection: null, ears: null };
    window.tokkTest = state;

    // Starts listen(). Called from the click handler (a user gesture) or from the spec without a click.
    async function start() {
      try {
        const sounds = await loadSounds(modelUrl);
        const on = Object.fromEntries(patterns.map((name) => [name, (m) => state.calls.push({ pattern: name, t: m.t })]));
        state.ears = await listen({ sounds, on, ...(params.has('debug') ? { debug: true } : {}), ...(source === undefined ? {} : { source }) });
        state.ready = true;
        return { ok: true };
      } catch (e) {
        state.rejection = e instanceof Error ? e.message : String(e);
        return { ok: false, message: state.rejection };
      }
    }
    state.start = start;
    // utostart calls listen() when the page loads, with no click, so there is no user gesture.
    if (params.has('autostart')) void start();
    document.getElementById('start').addEventListener('click', () => { void start(); });
  </script>
</body>
</html>
